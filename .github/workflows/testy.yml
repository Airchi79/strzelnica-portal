# Testy automatyczne przy każdym wysłaniu zmian: Python jak w obrazie produkcyjnym (Dockerfile), PostgreSQL jak w docker-compose.
name: Testy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: satok
          POSTGRES_USER: satok
          POSTGRES_PASSWORD: satok
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U satok -d satok"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: satok
      POSTGRES_USER: satok
      POSTGRES_PASSWORD: satok
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Zależności
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tesseract (odczyt legitymacji w kiosku — jak w obrazie produkcyjnym)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-pol
      - name: Zaległe migracje
        run: python manage.py makemigrations --check --dry-run
      - name: Kontrola konfiguracji
        run: python manage.py check
      - name: Testy
        run: python -m pytest -p no:cacheprovider
