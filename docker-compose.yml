# Strzelnica Sątok — uruchomienie: docker compose up -d --build
# Instrukcja dla Unraid: docs/WDROZENIE-UNRAID.md
#
# Wszystkie dane trwałe leżą w folderze projektu (a nie w wolumenach Dockera), żeby przetrwały
# odtworzenie docker.img na Unraid i były objęte kopią zapasową appdata:
#   ./data/postgres  — baza danych
#   ./data/private   — pliki prywatne (skany dokumentów do weryfikacji)
#   ./backups        — codzienne kopie bazy (7 ostatnich), każda sprawdzana przez odtworzenie (status.json)

x-app: &app
  build: .
  image: strzelnica-portal:latest
  restart: unless-stopped
  env_file: .env
  user: "${PUID:-99}:${PGID:-100}"
  environment:
    POSTGRES_HOST: db
  volumes:
    - ./data/private:/data/private
    - ./backups:/backups:ro   # tylko odczyt: stan kopii zapasowych w panelu i alarmy
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  app:
    <<: *app
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Zadania okresowe: co minutę zwalnianie wygasłych blokad terminów i nieopłaconych rezerwacji, lista oczekujących, zwroty Tpay i ponawianie e-maili;
  # co 5 minut wysyłka ogłoszeń; co godzinę przypomnienia, rozliczenia rezerwacji, wygaszanie dokumentów, zamykanie pobytów
  # i czyszczenie książki pobytu, zadania stowarzyszenia, raporty, kontrola kopii zapasowych.
  cron:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: >
      sh -c 'n=0; while true; do
        python manage.py expire_reservations;
        python manage.py process_waitlist;
        python manage.py process_refunds;
        python manage.py send_outbox;
        if [ $$((n % 5)) -eq 0 ]; then
          python manage.py send_announcements;
        fi;
        if [ $$((n % 60)) -eq 0 ]; then
          python manage.py send_reminders;
          python manage.py settle_reservations;
          python manage.py expire_credentials;
          python manage.py purge_logbook;
          python manage.py association_tasks;
          python manage.py sales_reports;
          python manage.py check_backups;
        fi;
        n=$$((n + 1));
        sleep 60;
      done'

  # Tunel Cloudflare jako kontener (opcjonalnie — uruchamiany z profilem „tunel”):
  #   docker compose --profile tunel up -d
  # Token tunelu wpisz w .env jako TUNNEL_TOKEN (Cloudflare → Zero Trust → Networks → Tunnels → Configure).
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunel"]

  # Codzienna kopia bazy danych (format pg_dump -Fc), 7 ostatnich plików.
  backup:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    # Co dobę: kopia bazy (7 ostatnich) i sprawdzenie, czy da się ją odtworzyć (tymczasowa baza satok_verify,
    # porównanie liczby danych z bazą produkcyjną). Wynik w backups/status.json — widoczny w panelu (System → Kopie zapasowe).
    entrypoint: ["sh", "/backup.sh"]
