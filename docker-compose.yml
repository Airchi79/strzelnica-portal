# Strzelnica Sątok — uruchomienie: docker compose up -d --build
# Instrukcja dla Unraid: docs/WDROZENIE-UNRAID.md
#
# Wszystkie dane trwałe leżą w folderze projektu (a nie w wolumenach Dockera), żeby przetrwały
# odtworzenie docker.img na Unraid i były objęte kopią zapasową appdata:
#   ./data/postgres  — baza danych
#   ./data/private   — pliki prywatne (skany dokumentów do weryfikacji)
#   ./backups        — codzienne kopie bazy (7 ostatnich)

x-app: &app
  build: .
  image: strzelnica-portal:latest
  restart: unless-stopped
  env_file: .env
  user: "${PUID:-99}:${PGID:-100}"
  environment:
    POSTGRES_HOST: db
  volumes:
    - ./data/private:/data/private
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  app:
    <<: *app
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Zadania okresowe (co godzinę): przypomnienia, rozliczenia rezerwacji, wygaszanie dokumentów, czyszczenie książki pobytu.
  cron:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: >
      sh -c 'while true; do
        python manage.py send_reminders;
        python manage.py settle_reservations;
        python manage.py expire_credentials;
        python manage.py purge_logbook;
        python manage.py association_tasks;
        sleep 3600;
      done'

  # Codzienna kopia bazy danych (format pg_dump -Fc), 7 ostatnich plików.
  backup:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'export PGPASSWORD=$$POSTGRES_PASSWORD;
      sleep 300;
      while true; do
        pg_dump -U $$POSTGRES_USER -d $$POSTGRES_DB -Fc -f /backups/satok-$$(date +%F).dump &&
        ls -1t /backups/satok-*.dump | tail -n +8 | xargs -r rm --;
        sleep 86400;
      done'
