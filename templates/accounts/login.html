{% extends "base.html" %}
{% block title %}Logowanie{% endblock %}
{% block content %}
<h1>Logowanie</h1>
<div class="card">
<form method="post" novalidate>{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% include "partials/form.html" %}
  <button class="btn" type="submit">Zaloguj</button>
</form>
</div>
<p><a href="{% url 'accounts:password_reset' %}">Nie pamiętam hasła</a> · <a href="{% url 'accounts:resend_verification' %}">Wyślij ponownie link aktywacyjny</a> · <a href="{% url 'accounts:register' %}">Załóż konto</a></p>
{% endblock %}
