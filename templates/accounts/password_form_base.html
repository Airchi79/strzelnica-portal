{% extends ACCOUNT_BASE|default:"base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<div class="card">
{% if validlink is False %}<p>Link jest nieprawidłowy lub wygasł. <a href="{% url 'accounts:password_reset' %}">Wyślij nowy</a>.</p>
{% else %}<form method="post" novalidate>{% csrf_token %}{% include "partials/form.html" %}<button class="btn" type="submit">Dalej</button></form>{% endif %}
</div>
{% endblock %}
