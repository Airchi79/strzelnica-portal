{% extends "base.html" %}
{% block title %}Sprawdź skrzynkę{% endblock %}
{% block content %}
<h1>Sprawdź skrzynkę e-mail</h1>
<div class="card"><p>Wysłaliśmy link potwierdzający na adres <strong>{{ email }}</strong>. Kliknij go, aby aktywować konto.</p>

{% endblock %}
