<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plakat — kod QR książki pobytu</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; color: #000; background: #fff; margin: 24px; }
  h1 { font-size: 34px; margin: 12px 0; } p { font-size: 18px; max-width: 640px; margin: 8px auto; }
  img { width: 420px; height: 420px; } .noprint { margin-bottom: 16px; }
  @media print { .noprint { display: none; } @page { size: A4 portrait; margin: 15mm; } }
</style></head>
<body>
<div class="noprint"><button onclick="window.print()">Drukuj</button> <a href="javascript:history.back()">Wróć</a></div>
<h1>STRZELNICA SĄTOK<br>Książka pobytu</h1>
<p><strong>Każda osoba przebywająca na strzelnicy wpisuje się do książki pobytu.</strong></p>
<img src="{{ qr }}" alt="Kod QR wpisu do książki pobytu">
<p>Zeskanuj kod aparatem telefonu, wybierz cel pobytu, uzupełnij dane i podpisz się palcem.</p>
<p style="font-size:14px">Strzelasz? Możesz też użyć kodu QR rezerwacji od prowadzącego strzelanie.</p>
</body></html>
