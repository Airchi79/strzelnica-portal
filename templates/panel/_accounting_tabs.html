<div class="tabs">
  {% with u=request.resolver_match.url_name %}
  <a href="{% url 'panel:accounting' %}" class="{% if u == 'accounting' or u == 'accounting_record' or u == 'accounting_edit' %}active{% endif %}">Zestawienie</a>
  <a href="{% url 'panel:accounting_add' 'przychod' %}" class="{% if u == 'accounting_add' and kind == 'przychod' %}active{% endif %}">Dodaj przychód</a>
  <a href="{% url 'panel:accounting_add' 'koszt' %}" class="{% if u == 'accounting_add' and kind == 'koszt' %}active{% endif %}">Dodaj koszt</a>
  <a href="{% url 'panel:accounting_assets' %}" class="{% if 'accounting_asset' in u %}active{% endif %}">Środki trwałe</a>
  <a href="{% url 'panel:accounting_ksef' %}" class="{% if 'accounting_ksef' in u %}active{% endif %}">Faktury KSeF</a>
  <a href="{% url 'panel:accounting_docs' %}" class="{% if 'accounting_doc' in u %}active{% endif %}">Dokumenty</a>
  <a href="{% url 'panel:accounting_years' %}" class="{% if u == 'accounting_years' %}active{% endif %}">Lata i zamknięcia</a>
  <a href="{% url 'panel:accounting_settings' %}" class="{% if u == 'accounting_settings' %}active{% endif %}">Ustawienia</a>
  {% endwith %}
</div>
