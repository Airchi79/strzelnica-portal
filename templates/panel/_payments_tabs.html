<div class="tabs">
  {% with u=request.resolver_match.url_name %}
  <a href="{% url 'panel:payments' %}" class="{% if u == 'payments' or u == 'payment' %}active{% endif %}">Wpłaty</a>
  <a href="{% url 'panel:payment_manual' %}" class="{% if u == 'payment_manual' %}active{% endif %}">Przyjmij wpłatę</a>
  <a href="{% url 'panel:payment_import' %}" class="{% if u == 'payment_import' %}active{% endif %}">Import wyciągu</a>
  <a href="{% url 'panel:wallets' %}" class="{% if 'wallet' in u %}active{% endif %}">Salda</a>
  {% endwith %}
</div>
