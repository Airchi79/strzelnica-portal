<div class="field{% if field.widget_type == 'checkbox' %} checkbox{% endif %}{% if field.errors %} has-error{% endif %}">
  {% if field.widget_type == 'checkbox' %}
    <label>{{ field }} {{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {% else %}
    <label for="{{ field.id_for_label }}" id="{{ field.auto_id }}_label"><span class="label-text">{{ field.label }}</span>{% if field.field.required %} <span class="req" title="pole wymagane" aria-hidden="true">*</span>{% else %} <span class="muted small">(opcjonalnie)</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  <span class="helptext" id="{{ field.auto_id }}_help">{{ field.help_text }}</span>
  {{ field.errors }}
</div>
