{% load static %}<div class="card push-box" data-push="{% url 'core:push_subscribe' %}" data-csrf="{{ csrf_token }}" hidden>
  <strong>Powiadomienia na telefonie</strong>
  <p class="small" data-push-status role="status"></p>
  <button type="button" class="btn" data-push-on hidden>Włącz powiadomienia na tym urządzeniu</button>
  <button type="button" class="btn secondary" data-push-test hidden>Wyślij powiadomienie testowe</button>
  <button type="button" class="btn secondary" data-push-off hidden>Wyłącz na tym urządzeniu</button>
  <details class="small muted" style="margin-top:8px"><summary>Szczegóły techniczne</summary><p data-push-diag style="margin:4px 0 0"></p></details>
</div>
<script src="{% static 'js/push.js' %}" defer></script>
